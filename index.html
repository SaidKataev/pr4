    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styletime.css">

</head>
<body id="body">
  <script src="snowFlakes/Snow.js"></script>
      <div class="snow"></div>


    <div class="start" id="start">
        <div class="start1" id="start1">
    
            <div class="menu">
                <span class="textvibor">Выберите один из вариантов</span>
                <div class="inputdiv">
                    <button class="label1" onclick="vkl()" id="vkl1"> Атмосфера </button>
                    <button class="label2" onclick="vkl1()" id="vkl2"> Назад </button>

                </div>
            </div>
            <div class="starttimebig">

                    <span class="days countdown-time"></span>

                  </div>
                  <div class="countdown-number">
                    <span class="hours countdown-time"></span>
                    <span class="countdown-text">Часов</span>
                  </div>
                  <div class="countdown-number">
                    <span class="minutes countdown-time"></span>
                    <span class="countdown-text">Минут</span>
                  </div>
                  <div class="countdown-number">
                    <span class="seconds countdown-time"></span>
                    <span class="countdown-text">Секунд</span>
                  </div>
                </div>
            </div>
        </div>
